<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticando - P-JARI/SC</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: #f8fafc;
            height: 100vh; width: 100vw;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }
        .wrapper { display: flex; flex-direction: column; align-items: center; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner {
            width: 2.5rem; height: 2.5rem;
            margin-bottom: 1rem;
            animation: spin 1s linear infinite;
        }
        h2 { font-size: 1.25rem; font-weight: 600; color: #1e293b; }
        p  { font-size: 0.875rem; color: #64748b; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <div class="wrapper">
        <svg class="spinner" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle style="opacity:.25" cx="12" cy="12" r="10" stroke="#2563eb" stroke-width="4"></circle>
          <path style="opacity:.75" fill="#2563eb" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <h2>Preparando seu ambiente...</h2>
        <p>Sincronizando chave de segurança.</p>
    </div>

    <script>
        window.clerkPublishableKey = "{{ CLERK_PUBLISHABLE_KEY }}";
    </script>
    <script
        async
        crossorigin="anonymous"
        data-clerk-publishable-key="{{ CLERK_PUBLISHABLE_KEY }}"
        src="https://cdn.jsdelivr.net/npm/@clerk/clerk-js@5/dist/clerk.browser.js"
        type="text/javascript"
    ></script>

    <script type="module">
        import { ptBR } from 'https://cdn.jsdelivr.net/npm/@clerk/localizations/dist/pt-BR.mjs';

        window.addEventListener('load', async function () {
            await Clerk.load({ localization: ptBR });

            if (Clerk.user) {
                try {
                    const token = await Clerk.session.getToken();
                    if (token) {
                        const isHttps = window.location.protocol === 'https:';
                        document.cookie = `__session=${token}; path=/; max-age=3600; SameSite=Lax;${isHttps ? ' Secure' : ''}`;
                    }
                } catch(e) {
                    console.error("Erro na sincronização de token", e);
                }
                window.location.href = '/app/';
            } else {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
