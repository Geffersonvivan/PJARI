name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Lint (rápido, sem DB) ────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true
      - run: pip install ruff
      - name: Ruff (lint)
        run: ruff check pareceres config core

  # ── Testes + auditoria de segurança (Postgres + pgvector) ────────────────
  # A auditoria roda AQUI (não num job separado) porque só o ambiente já
  # instalado resolve o wheel `torch==2.12.1+cpu` (índice do PyTorch); o
  # `pip-audit -r requirements.txt` isolado não consegue e falharia por
  # resolução, não por vulnerabilidade.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pjari_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      SECRET_KEY: ci-test-secret-key
      DEBUG: "True"
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pjari_test
      # REDIS_URL propositalmente AUSENTE: mantém AUDIT_ASYNC=False (gravação
      # síncrona do AuditLog), deixando os testes determinísticos como no local.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          allow-prereleases: true

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install system dependencies (WeasyPrint)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect static (constrói o manifest exigido pelos testes de template)
        run: python manage.py collectstatic --noinput

      - name: Run tests (cria o banco de teste + extensão pgvector via migração)
        run: python manage.py test --verbosity=2

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      # BLOQUEANTE: audita as dependências REAIS instaladas (inclui torch cpu +
      # pip já atualizado). Falha o build em QUALQUER vulnerabilidade conhecida.
      - name: Auditoria de dependências (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --progress-spinner off
